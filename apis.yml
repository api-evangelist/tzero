apis:
- aid: tzero:fix
  name: tZERO FIX API
  description: >-
    FIX 4.2 / 4.4 protocol surface for low-latency order entry, drop-copy execution reports, market data
    (snapshot and incremental refresh, trading session status, security status) and Indication of Interest
    (IOI) market data against the tZERO ATS. Message-by-message specifications are published on the tZERO
    API docs site; session credentials and connectivity are arranged with tZERO.
  humanURL: https://apidocs.tzero.com/docs/fix
  tags:
  - FIX Protocol
  - Order Entry
  - Market Data
  - Drop Copy
  properties:
  - type: Documentation
    url: https://apidocs.tzero.com/docs/fix
  x-transport: >-
    FIX 4.2 / 4.4 over TCP; session host, port, CompIDs and credentials are arranged with tZERO and are
    not published
