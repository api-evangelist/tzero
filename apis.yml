apis:
- aid: tzero:issuance-secondary-markets
  name: tZERO Issuance & Secondary Markets API
  description: REST/JSON API for creating individual broker-dealer accounts, triggering and reviewing
    KYC on investors, browsing primary offerings and managing investments, linking bank accounts and moving
    funds, reading balances, retrieving market schedules and public price history/snapshots, and placing,
    listing and cancelling orders on the tZERO ATS. Authenticated with an x-apikey header plus a bearer
    JWT obtained from POST /auth/v1/api/token.
  humanURL: https://apidocs.tzero.com/docs/explorer
  baseURL: https://gateway-web-api.tzero.com/app
  tags:
  - Trading
  - Onboarding
  - KYC
  - Investments
  - Market Data
  properties:
  - type: OpenAPI
    url: openapi/tzero-issuance-secondary-markets-openapi.json
  - type: Documentation
    url: https://apidocs.tzero.com/docs
  - type: APIReference
    url: https://apidocs.tzero.com/docs/explorer
- aid: tzero:institutional
  name: tZERO Institutional API
  description: 'REST/JSON API giving institutional issuers and partners programmatic access to tZERO transfer-agent,
    tokenization and custody operations: investors and holdings, securities and cap tables, book-entry
    transfers, issuance requests, documents, dividends, corporate actions, voting proposals, settlement
    instructions, omnibus investor accounts, token deployments, custody vaults/whitelists, and HMAC-signed
    webhooks. Authenticated with an X-API-Key header carrying scoped permissions.'
  humanURL: https://apidocs.tzero.com/docs/institutional
  baseURL: https://api.t0direct.com/api/v1
  tags:
  - Transfer Agent
  - Tokenization
  - Custody
  - Corporate Actions
  - Webhooks
  properties:
  - type: OpenAPI
    url: openapi/tzero-institutional-openapi.json
  - type: APIReference
    url: https://api.t0direct.com/api/v1/docs/
- aid: tzero:fix
  name: tZERO FIX API
  description: FIX 4.2 / 4.4 protocol surface for low-latency order entry, drop-copy execution reports,
    market data (snapshot and incremental refresh, trading session status, security status) and Indication
    of Interest (IOI) market data against the tZERO ATS. Message-by-message specifications are published
    on the tZERO API docs site; session credentials and connectivity are arranged with tZERO.
  humanURL: https://apidocs.tzero.com/docs/fix
  tags:
  - FIX Protocol
  - Order Entry
  - Market Data
  - Drop Copy
  properties:
  - type: Documentation
    url: https://apidocs.tzero.com/docs/fix
  x-transport: FIX 4.2 / 4.4 over TCP; session host, port, CompIDs and credentials are arranged with tZERO
    and are not published
