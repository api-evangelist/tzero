aid: tzero
name: tZERO
description: 'tZERO Technologies is a US financial-technology company building regulated infrastructure
  for tokenized real-world assets and digital securities. Through its SEC- and FINRA-regulated broker-dealer,
  Alternative Trading System (tZERO ATS, continuously operating since 2019), special purpose broker-dealer
  for digital custody, and SEC-registered transfer agent, tZERO covers the full lifecycle: capital formation
  and token issuance, secondary trading and market data, clearance and settlement, cap-table recordkeeping,
  corporate actions, dividends and proxy voting. Its developer surface — marketed as tZERO Connect — publishes
  two public OpenAPI 3.0.3 contracts (an Issuance & Secondary Markets REST API on gateway-web-api.tzero.com
  and an Institutional transfer-agent / tokenization / custody API on api.t0direct.com) alongside FIX
  4.2 / 4.4 specifications for order entry, drop copy and market data.'
url: https://raw.githubusercontent.com/api-evangelist/tzero/refs/heads/main/apis.yml
image: https://tzero.com/api/sanity-assets/images/jpd7ydtd/pre-prod/bcb9e8e2a5c5bf41d9938781a368d92635b0923a-595x156.svg?w=1200&h=627&fit=crop&auto=format
