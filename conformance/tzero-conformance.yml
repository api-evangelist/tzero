- id: rfc9116-security-txt
  conforms: false
  evidence: /.well-known/security.txt returns 404 on every tZERO host (well-known/tzero-well-known.yml)
- id: rfc8594-sunset-header
  conforms: false
  evidence: no deprecation or sunset policy published
- id: idempotency
  conforms: true
  evidence: >-
    Idempotency-Key header on Institutional dividend/corporate-action/proposal mutations
    (409 on key reuse with a different payload); idempotencyKey field on transfers and
    issuances; client-supplied transactionId on Issuance & Secondary Markets investments and orders
- id: pagination
  conforms: true
