standards:
- id: fix-4.2
  name: FIX Protocol 4.2
  conforms: true
  domain_standard: true
  evidence: >-
    tZERO publishes a full FIX 4.2 Order Entry Specification (New Order Single MsgType=D,
    Order Cancel Request, Order Cancel/Replace Request, execution reports) and a FIX 4.2 IOI
    Market Data Specification, tag by tag, at https://apidocs.tzero.com/docs/fix/order-entry
    and /docs/fix/ioi-market-data. Non-standard tags are explicitly labelled as such
    (e.g. 8721-8723 MWCBLvl1-3Prx, 8724 ShortSellRstrcn).
  spec_location: https://apidocs.tzero.com/docs/fix/order-entry
- id: fix-4.4
  name: FIX Protocol 4.4
  conforms: true
  domain_standard: true
  evidence: >-
    FIX 4.4 DROPCOPY Specification (execution reports MsgType=8 for acknowledgements, fills,
    cancels, rejects, busts and trade corrections) and FIX 4.4 Market Data Specification
    (Market Data Request/Snapshot/Incremental Refresh, Trading Session Status, Security Status),
    both dated December 2025.
  spec_location: https://apidocs.tzero.com/docs/fix/market-data
- id: openapi-3.0
  conforms: true
  evidence: two published OpenAPI 3.0.3 documents (Issuance & Secondary Markets, Institutional)
- id: oauth2
  conforms: false
  evidence: no oauth2 securityScheme in either contract; auth is api-key plus an opaque bearer JWT
- id: oidc
  conforms: false
  evidence: /.well-known/openid-configuration returns 404 on every tZERO host
- id: rfc9457-problem-details
  conforms: false
